[package]
name = "kosh"
version = "0.1.0"
description = "KOSH.id — micro-lending protocol for Indian gig workers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kosh"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1" }
anchor-spl = { version = "0.30.1", features = ["token"] }
# sha2 for oracle nullifier computation (SHA-256)
sha2 = { version = "0.10", default-features = false }
# No external pyth crate needed — we parse Pyth price account data
# inline to avoid solana-program version conflicts. See instructions/request_loan.rs.
